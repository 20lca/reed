# Add this location block inside your existing bonsai.uno server {} block.
#
# Nginx strips the /reed prefix before forwarding to uvicorn.
# Uvicorn's --root-path /reed tells FastAPI it is mounted at that subpath,
# which keeps the OpenAPI schema, /docs, and any redirect URLs correct.

location /reed/ {
    proxy_pass         http://127.0.0.1:8765/;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # LCA calculations can take a while — raise the default 60 s timeout
    proxy_read_timeout 300;
    proxy_send_timeout 300;
}
